<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250" role="img" aria-label="The PerkaBoo ghost rising from behind a credit card">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F5FF"/><stop offset="1" stop-color="#C3C9FF"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF0FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#1B1163" flood-opacity="0.35"/></filter>
  </defs>
  <style>
    /* The ghost starts hidden behind the card, rises up, then floats up and down. The card stays put. */
    .rise { animation: rise 1.3s cubic-bezier(.2, .9, .3, 1.15) .35s backwards; }
    .bob { animation: bob 3.6s ease-in-out 1.7s infinite; }
    .blink { transform-box: fill-box; transform-origin: center; animation: blink 5s ease-in-out 2.5s infinite; }
    @keyframes rise { from { transform: translateY(155px); } to { transform: translateY(0); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-13px); } }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
    @media (prefers-reduced-motion: reduce) { .rise, .bob, .blink { animation: none; } }
  </style>
  <g filter="url(#shadow)">
    <g class="rise"><g class="bob">
      <path d="M62 160 L66 98 C68 58 96 28 122 28 C148 28 174 58 176 98 L180 160 Z" fill="url(#body)"/>
      <g class="blink"><ellipse cx="98" cy="88" rx="8.5" ry="12" fill="#2E2A9B"/><ellipse cx="146" cy="85" rx="8.5" ry="12" fill="#2E2A9B"/>
      <circle cx="95.5" cy="82.5" r="2.8" fill="#fff"/><circle cx="143.5" cy="79.5" r="2.8" fill="#fff"/></g>
      <path d="M112 112 Q122 122 134 111" fill="none" stroke="#2E2A9B" stroke-width="4.5" stroke-linecap="round"/>
    </g></g>
    <g transform="rotate(-5 122 190)">
      <rect x="32" y="150" width="180" height="102" rx="20" fill="url(#card)"/>
      <rect x="50" y="170" width="34" height="25" rx="6" fill="#5B5BEF"/>
      <rect x="50" y="212" width="78" height="9" rx="4.5" fill="#9AA2FF"/>
      <path d="M172 168 l5 11 l11 5 l-11 5 l-5 11 l-5 -11 l-11 -5 l11 -5 z" fill="#4F46E5"/>
      <circle cx="198" cy="166" r="4" fill="#5B5BEF"/>
    </g>
    <g class="rise"><g class="bob">
      <ellipse cx="78" cy="152" rx="17" ry="9.5" fill="#fff" stroke="#C7CCFF" stroke-width="3" transform="rotate(-6 78 152)"/>
      <ellipse cx="170" cy="144" rx="17" ry="9.5" fill="#fff" stroke="#C7CCFF" stroke-width="3" transform="rotate(-6 170 144)"/>
    </g></g>
  </g>
</svg>
